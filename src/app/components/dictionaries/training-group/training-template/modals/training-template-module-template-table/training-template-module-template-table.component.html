<div>
  <div class="btns-container">
    @if (!isView) {
      <a (click)="openCreateModuleTemplateModal()" class="link-btn">
        {{ 'trainingTemplateModalAddModuleBtn' | transloco }}
      </a>
    }
  </div>
</div>

<app-table-wrapper
  #tableWrapper
  [tableId]="'trainingTemplateModuleTemplateTable'"
  [displayedColumns]="displayedColumns"
  [searchContainerClass]="'expansion-search-input-field'"
  [tableContainerClass]="'expansion-table'"
  [tableColTemplateList]="tableColTemplateList"
>
  <ng-template tableWrapperColumn="name" let-moduleTemplate="row">
    <div class="row-with-action-btns">
      {{ moduleTemplate.name }}
      <div class="row-with-action-btns-container">
        @if (isView) {
          <mat-icon class="row-btns view" (click)="openViewModuleTemplateModal(moduleTemplate)">visibility</mat-icon>
        } @else {
          <mat-icon class="row-btns edit" (click)="openEditModuleTemplateModal(moduleTemplate)">edit</mat-icon>
          <mat-icon class="row-btns remove" (click)="removeModuleTemplateFromList(moduleTemplate)">clear</mat-icon>
        }
      </div>
    </div>
  </ng-template>
</app-table-wrapper>
