<mat-form-field [appearance]="appearance" [ngClass]="searchStyleClass ? searchStyleClass : 'search-input'">
  <mat-icon matPrefix>search</mat-icon>
  @if (!offLabel) {
    <mat-label>
      {{ 'searchTable' | transloco }}
    </mat-label>
  }
  <input matInput class="input-field" [(ngModel)]="search" (input)="applySearch.emit(search)" />
</mat-form-field>
