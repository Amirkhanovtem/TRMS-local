@if (!isView) {
  <div class="btns-container">
    <a (click)="openLinearTrainerModal()" class="link-btn">
      {{ 'creatingEventLinearTrainerTableAddLinearTrainers' | transloco }}
    </a>
  </div>
}

<app-table-wrapper
  #tableWrapper
  [tableId]="tableId"
  [displayedColumns]="displayedColumns"
  [searchContainerClass]="'expansion-search-input-field'"
  [tableContainerClass]="'expansion-table'"
  [tableColTemplateList]="tableColTemplateList"
>
  <ng-template tableWrapperColumn="actions" let-linearTrainer="row">
    <div class="row-with-action-btns-container">
      <mat-icon class="row-btns view" (click)="linearTrainerOpenViewModal(linearTrainer)">visibility</mat-icon>
      @if (!isView) {
        <mat-icon class="row-btns remove" (click)="removeLinearTrainerFromList(linearTrainer)">clear</mat-icon>
      }
    </div>
  </ng-template>
</app-table-wrapper>
