@if (!isView) {
  <div class="btns-container">
    <a (click)="openEquipmentsModal()" class="link-btn">
      {{ 'creatingEventTableAddEquipments' | transloco }}
    </a>
  </div>
}

<app-table-wrapper
  #tableWrapper
  [tableId]="tableId"
  [displayedColumns]="displayedColumns"
  [tableContainerClass]="'expansion-table'"
  [searchContainerClass]="'expansion-search-input-field'"
  [tableColTemplateList]="tableColTemplateList"
>
  <ng-template tableWrapperColumn="actions" let-equipment="row">
    <div class="row-with-action-btns-container">
      <mat-icon class="row-btns view" (click)="equipmentOpenViewModal(equipment)">visibility</mat-icon>
      @if (canDeleteRow(equipment)) {
        <mat-icon class="row-btns remove" (click)="removeEquipmentFromList(equipment)">clear</mat-icon>
      }
    </div>
  </ng-template>
</app-table-wrapper>
