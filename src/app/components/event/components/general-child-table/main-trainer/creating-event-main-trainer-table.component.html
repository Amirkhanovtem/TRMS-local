@if (!isView) {
  <div class="btns-container">
    <a (click)="openMainTrainerModal()" class="link-btn">
      {{ 'creatingEventMainTrainerTableAddMainTrainers' | transloco }}
    </a>
  </div>
}

<app-table-wrapper
  #tableWrapper
  [tableId]="tableId"
  [displayedColumns]="displayedColumns"
  [searchContainerClass]="'expansion-search-input-field'"
  [tableContainerClass]="'expansion-table'"
  [tableColTemplateList]="tableColTemplateList"
>
  <ng-template tableWrapperColumn="actions" let-mainTrainer="row">
    <div class="row-with-action-btns-container">
      <mat-icon class="row-btns view" (click)="mainTrainerOpenViewModal(mainTrainer)">visibility</mat-icon>
      @if (!isView) {
        <mat-icon class="row-btns remove" (click)="removeMainTrainerFromList(mainTrainer)">clear</mat-icon>
      }
    </div>
  </ng-template>
</app-table-wrapper>
